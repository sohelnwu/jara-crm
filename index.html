<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>জারা ইলেকট্রিক CRM</title>
<meta name="description" content="JARA ELECTRIC CRM — নির্মাণাধীন বাড়ি, মিস্ত্রি ও পাইকারি ক্রেতার মাঠ ব্যবস্থাপনা">
<meta name="theme-color" content="#0B2545">
<link rel="manifest" href="manifest.json?v=11">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css?v=11">
</head>
<body>

<div id="boot" class="boot"><div class="boot-mark">জ</div><p>লোড হচ্ছে…</p></div>

<header class="topbar" id="topbar" hidden>
  <button class="tb-back" id="btnBack" hidden aria-label="পেছনে">‹</button>
  <div class="tb-title">
    <span class="tb-eyebrow">জারা ইলেকট্রিক CRM</span>
    <h1 id="viewTitle">আজকের কাজ</h1>
  </div>
  <button class="tb-act" id="btnAdd" aria-label="নতুন কাস্টমার">＋</button>
</header>

<main id="app" hidden></main>

<nav class="tabbar" id="tabbar" hidden>
  <button data-view="today"  class="on"><span class="ic">◉</span><span>আজ</span></button>
  <button data-view="follow"><span class="ic">⏱</span><span>ফলো-আপ</span></button>
  <button data-view="people"><span class="ic">☷</span><span>কাস্টমার</span></button>
  <button data-view="map"><span class="ic">◈</span><span>ম্যাপ</span></button>
  <button data-view="report"><span class="ic">▤</span><span>রিপোর্ট</span></button>
</nav>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="login-mark">জ</div>
    <h1>জারা ইলেকট্রিক CRM</h1>
    <p>মাঠ ব্যবস্থাপনা</p>
    <label class="field"><span>ইমেইল</span>
      <input id="liEmail" type="email" autocomplete="username" inputmode="email" required></label>
    <label class="field"><span>পাসওয়ার্ড</span>
      <input id="liPass" type="password" autocomplete="current-password" required></label>
    <div id="liErr" class="error-box" hidden></div>
    <button class="btn gold block" id="liGo" type="submit">লগইন</button>
    <p class="login-note">অ্যাকাউন্ট না থাকলে মালিকের কাছ থেকে নিন।</p>
  </form>
</div>

<div class="picker" id="vpick" hidden>
  <div class="picker-head">
    <button class="x" id="vpCancel" aria-label="বাতিল">✕</button>
    <div><b id="vpTitle">গ্রাম বাছুন</b><small id="vpSub">নাম লিখে খুঁজুন</small></div>
  </div>
  <div class="vp-search"><input id="vpQ" type="search" placeholder="নাম লিখুন…" autocomplete="off"></div>
  <div id="vpList" class="vp-list"></div>
  <div class="picker-foot">
    <button class="btn gold block" id="vpOwn">তালিকায় নেই — নিজে লিখব</button>
  </div>
</div>

<div class="picker" id="picker" hidden>
  <div class="picker-head">
    <button class="x" id="pkCancel" aria-label="বাতিল">✕</button>
    <div><b>বাড়ির জায়গায় চাপুন</b><small id="pkHint">ম্যাপ সরিয়ে বাড়িটা খুঁজুন, তারপর চাপ দিন</small></div>
  </div>
  <div id="pkMap"></div>
  <div class="picker-foot">
    <div class="pkread num" id="pkRead">কোনো পিন বসানো হয়নি</div>
    <div class="btnrow"><button class="btn sec" id="pkHere">◎ আমার অবস্থান</button>
    <button class="btn gold" id="pkOk">এখানেই পিন</button></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="villages.js?v=11"></script>
<script src="store.js?v=11"></script>
<script src="app.js?v=11"></script>
</body>
</html>
